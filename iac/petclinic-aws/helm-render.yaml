kind: Deployment
metadata:
  name: spring-petclinic
  labels:
        app: spring-petclinic
        service: spring-petclinic
  annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/spring-petclinic-aws-irsa-pod-role
spec:
  replicas: 1
  
  selector:
    matchLabels:
        app: spring-petclinic
        service: spring-petclinic
  template:
    metadata:
      labels:
        app: spring-petclinic
        service: spring-petclinic
    spec:
      serviceAccountName: sa-petclinic
      volumes:
        - name: db-secrets
          secret:
            secretName: map[secretName:spring-petclinic]
          
      containers:
        - name: petclinic-aks-aws-v02
          image: "99999999999999.dkr.ecr.us-west-2.amazonaws.com/aksecr:petclinic-3.2.0"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          envFrom:
          volumeMounts:
            - name: db-secrets
              mountPath: /etc/db-secrets
              subPath: 
              readOnly: true
          env:
            - name: MYSQL_PASS
              value: "petclinic"
            - name: MYSQL_URL
              value: "localhost/petclinic"
            - name: MYSQL_USER
              value: "petclinic"
            - name: POSTGRES_PASS
              value: "petclinic"
            - name: POSTGRES_URL
              value: "localhost/petclinic"
            - name: POSTGRES_USER
              value: "petclinic"
            - name: REDIS_ENDPOINT
              value: 
            - name: REDIS_HOST
              value: "localhost"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PWD
              value: "redis"
            - name: REDIS_USER
              value: "redis"
            - name: SPRING_AWS_PROFILE
              value: "dev"
            - name: SPRING_PROFILES_ACTIVE
              value: "mysql"
            - name: database
              value: "petclinic"
