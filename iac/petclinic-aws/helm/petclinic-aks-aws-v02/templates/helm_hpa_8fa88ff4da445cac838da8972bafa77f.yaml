{{- if .Values.helm_hpa_8fa88ff4da445cac838da8972bafa77f.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.helm_hpa_8fa88ff4da445cac838da8972bafa77f.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: {{ .Values.helm_hpa_8fa88ff4da445cac838da8972bafa77f.workload_kind }}
    name: {{ .Values.helm_hpa_8fa88ff4da445cac838da8972bafa77f.workload_name }}
  minReplicas: {{ .Values.helm_hpa_8fa88ff4da445cac838da8972bafa77f.min_replicas }}
  maxReplicas: {{ .Values.helm_hpa_8fa88ff4da445cac838da8972bafa77f.max_replicas }}
  metrics:
    {{- if .Values.helm_hpa_8fa88ff4da445cac838da8972bafa77f.target_cpu_utilization_percentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.helm_hpa_8fa88ff4da445cac838da8972bafa77f.target_cpu_utilization_percentage }}
    {{- end }}
    {{- if .Values.helm_hpa_8fa88ff4da445cac838da8972bafa77f.target_memory_utilization_percentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.helm_hpa_8fa88ff4da445cac838da8972bafa77f.target_memory_utilization_percentage }}
    {{- end }}
{{- end }}