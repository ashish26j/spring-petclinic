    annotations_enable: true
    annotations: {}
    automount: false
    labels: {}
    name: sa-petclinic
helm_workload_68a4e8b8568c516bae1bb084e13f5124:
    annotations_enable: true
    annotations: 
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/spring-petclinic-aws-irsa-pod-role
    env:
        MYSQL_PASS: petclinic
        MYSQL_URL: localhost/petclinic
        MYSQL_USER: petclinic
        POSTGRES_PASS: petclinic
        POSTGRES_URL: localhost/petclinic
        POSTGRES_USER: petclinic
        SPRING_AWS_PROFILE: dev
        database: petclinic
        REDIS_ENDPOINT: 
        REDIS_USER: redis
        REDIS_PWD: redis
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        SPRING_PROFILES_ACTIVE: mysql
        SPRINT_RUN_PLATFORM: aws
    env_from_config: []
    env_from_secret: []
    image: "99999999999999.dkr.ecr.us-west-2.amazonaws.com/aksecr"
    image_pull_policy: Always
    image_pull_secret: null
    image_tag: petclinic-3.2.0
    kind: Deployment
    labels:
        service: spring-petclinic
        app: spring-petclinic
    name: spring-petclinic
    port: 8090
    protocol: TCP
    replicas: 1
    service_account: sa-petclinic
    volume_mounts:
        - name: db-secrets
          readOnly: true
          mountPath: "/etc/db-secrets"  #but app should use this path for credentials.
    volumes: 
        - name: db-secrets
          secret:
            secretName: spring-petclinic
