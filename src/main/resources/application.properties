# database init, supports mysql too
database=${SPRING_PROFILES_ACTIVE:h2}
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# redis cache
# Redis connection URL built from ENV vars with fallbacks
spring.data.redis.url=rediss://${REDIS_USER:test}:${REDIS_PWD:test}@${REDIS_HOST:localhost}:${REDIS_PORT:6379}
spring.data.redis.database=0

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true

# Internationalization
spring.messages.basename=messages/messages

# Actuator
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h

# default to local if not set in env:: Possible values are "azure" | "aws" | "local"
app.run.platform=${SPRINT_RUN_PLATFORM:local}

#Local run
app.init.pet-types.local.path=./petclinic-pettypes.txt


#Azure
spring.cloud.azure.storage.blob.account-name=spring-petclinic-init
spring.cloud.azure.storage.blob.account-key=spring-petclinic-init


#AWS # credentials picked up from IAM role or the Default Credentials Provider chain (EC2/ECS/EKS)
aws.region=us-east-1
spring.cloud.aws.region.static=us-east-1
# S3 location of your init file
app.init.pet-types.s3.bucket=spring-petclinic-init
app.init.pet-types.s3.key=petclinic-pettypes.txt
app.init.pet-types.kms-encrypted=false
